name: Pages

# Publie dist/ sur la branche gh-pages. Activer une fois :
# Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [main]
    paths: ['dist/**', 'build.config.json', 'scripts/site.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Publier la démonstration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: dist/ correspond aux sources
        run: node scripts/build.mjs --check
      - run: node scripts/site.mjs
      - name: Pousser _site/ sur gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
